<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable - 404</title>
    <style>
        /* Styles de base cohérents avec ton portfolio */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #fdfbf7;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .error-container {
            max-width: 500px;
            padding: 40px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .error-code {
            font-size: 5rem;
            font-weight: 800;
            color: #0066cc;
            margin: 0 0 10px 0;
            line-height: 1;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #111;
        }

        p {
            color: #555;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            background-color: #0066cc;
            color: #fff;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #0052a3;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <p class="error-code">404</p>
        <h1>Oups, cette page n'existe pas !</h1>
        <p>Il semblerait que le lien que tu as suivi soit incorrect ou que la page ait été déplacée.</p>
        <a href="index.html" class="btn">Retour à l'accueil</a>
    </div>

</body>
</html>
